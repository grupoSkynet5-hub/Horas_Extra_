<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horas extra</title>
<style>
:root{--bg:#eaf6e6;--card:#fff;--tx:#1b1f24;--mut:#5b6573;--ac:#1e8a2e;--bd:#cfe3c9;--ok:#0f7b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8ebef;--mut:#9aa4b2;--ac:#5fd06b;--bd:#2d333c;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#e8ebef;--mut:#9aa4b2;--ac:#5fd06b;--bd:#2d333c;--ok:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.lg{margin-bottom:6px;text-align:center}.lg img{max-width:100%;height:auto;max-height:110px;width:auto}
.g>div{min-width:0}
input,select{min-width:0;height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pc{position:relative}.pc img{width:110px;height:110px;object-fit:cover;border-radius:8px;display:block}.pc button{position:absolute;top:2px;right:2px;background:var(--card)}
h1{color:var(--ac);font-size:1.5rem;margin:8px 0 2px}
p.s{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;border-top:4px solid var(--ac);padding:14px;margin-bottom:14px}
h2{color:var(--ac);font-size:1rem;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
input,select,button{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
#wa{background:#25a244}
button.x{background:transparent;color:var(--mut);border:1px solid var(--bd);width:auto;padding:4px 9px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tot div{background:var(--bg);border-radius:10px;padding:10px}
.tot b{display:block;font-size:1.3rem;color:var(--ac)}
.tot span{font-size:.8rem;color:var(--mut)}
.ok{color:var(--ok)}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:.92rem}
th{color:var(--ac);font-weight:600;font-size:.8rem}
.r{text-align:right}
.e{color:var(--mut);padding:14px 0;text-align:center}
.capbox{border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:9px}.capbox textarea{font:inherit;width:100%;border:0;outline:0;padding:0;background:transparent;color:var(--tx);resize:none;display:block;min-height:1.5em;overflow:hidden}#picn{font-size:.85rem;color:var(--mut);margin-top:8px}.capbox .pics{margin-top:8px}
</style>
</head>

<h1>Horas extra</h1>

<section class="card">
<h2>Agregar horas extra</h2>
<div class="g">
<div style="grid-column:1/-1"><label for="tc">Nombre del técnico</label><input id="tc" type="text" placeholder="Nombre completo" style="font-size:1.15rem;padding:14px"></div>
<div><label for="f">Fecha</label><input id="f" type="date"></div>
<div><label for="t">Tipo</label>
<select id="t"><option value="0">Diurna</option><option value="1">Mixta</option><option value="2">Nocturna</option><option value="3">Feriado / descanso</option></select></div>
<div><label for="h">Horas</label><input id="h" type="number" min="0.25" step="0.25" value="1"></div>
<div><label for="n">Nota</label><input id="n" type="text" placeholder="Opcional"></div>
<div style="align-self:end"><button id="add" type="button">Agregar</button></div>
</div>
</section>

<section class="card">
<h2>Resumen</h2>
<div class="tot">
<div><b id="th">0</b><span>Horas extra</span></div>
</div>
</section>

<section class="card">
<h2>Registro</h2>
<div class="w"><table>
<thead><tr><th>Técnico</th><th>Fecha</th><th>Tipo</th><th class="r">Horas</th><th>Nota</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
<div id="empty" class="e">Aún no hay horas registradas.</div>
</section>

<section class="card">
<h2>Captaciones</h2>
<div class="capbox">
<textarea id="cap" rows="1" aria-label="Captaciones"></textarea>
<div id="picn"></div>
<div id="pics" class="pics"></div>
</div>
<input id="ph" type="file" accept="image/*" multiple style="display:none">
<button id="addph" type="button" style="margin-top:10px">Subir fotos</button>
</section>

<button id="wa1" type="button" style="padding:14px;font-size:1.05rem;margin-bottom:10px">Enviar a Danilo Márquez</button>
<button id="wa2" type="button" style="padding:14px;font-size:1.05rem;margin-bottom:14px">Enviar a Rene Chavez</button>
</main>
<script>
var T=["Diurna","Mixta","Nocturna","Feriado / descanso"];
var $=function(i){return document.getElementById(i)};
var data=[];
try{var s=localStorage.getItem("horas-extra-v1");if(s){var o=JSON.parse(s);data=o.data||[];$("cap").value=o.cap||"";}}catch(e){}
function save(){try{var o={data:data,cap:$("cap").value};localStorage.setItem("horas-extra-v1",JSON.stringify(o))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
var tb=$("rows"),th=0,html="";
data.slice().sort(function(a,b){return a.f<b.f?1:-1}).forEach(function(r){
th+=r.h;
html+="<tr><td>"+esc(r.tc||"")+"</td><td>"+esc(r.f)+"</td><td>"+T[r.t]+"</td><td class='r'>"+r.h+"</td><td>"+esc(r.n||"")+"</td><td><button class='x' data-id='"+r.id+"' aria-label='Eliminar'>✕</button></td></tr>"});
tb.innerHTML=html;
$("empty").style.display=data.length?"none":"block";
$("th").textContent=th;
}
$("add").onclick=function(){
var h=parseFloat($("h").value);
if(!$("tc").value.trim()||!$("f").value||!(h>0)){alert("Indica el nombre del técnico, la fecha y las horas.");return}
data.push({id:Date.now(),tc:$("tc").value.trim(),f:$("f").value,t:+$("t").value,h:h,n:$("n").value});
$("n").value="";save();render();
};
$("rows").onclick=function(e){
var id=e.target.getAttribute&&e.target.getAttribute("data-id");
if(id){data=data.filter(function(r){return r.id!=id});save();render()}
};
var pics=[];
try{pics=JSON.parse(localStorage.getItem("horas-extra-fotos")||"[]")}catch(e){}
function savePics(){try{localStorage.setItem("horas-extra-fotos",JSON.stringify(pics))}catch(e){alert("No hay espacio para guardar más fotos.")}}
function renderPics(){$("picn").textContent=pics.length?"Fotos de captaciones ("+pics.length+")":"";$("pics").innerHTML=pics.map(function(p,i){return "<div class='pc'><img src='"+p+"' alt='Foto'><button class='x' data-i='"+i+"' aria-label='Quitar foto'>✕</button></div>"}).join("")}
$("addph").onclick=function(){$("ph").click()};
$("ph").onchange=function(){
var inp=this,fs=Array.prototype.slice.call(inp.files),n=fs.length;
if(!n)return;
function done(){if(--n<=0)inp.value=""}
fs.forEach(function(f){
var r=new FileReader();
r.onerror=function(){alert("No se pudo leer una foto.");done()};
r.onload=function(){
var im=new Image();
im.onerror=function(){alert("Formato de foto no compatible.");done()};
